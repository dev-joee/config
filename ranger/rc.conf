# --------------------------
# Basic Options
# --------------------------
set show_hidden false
set preview_files true
set preview_images true
set draw_borders true
set column_ratios 1 2 3
set preview_images true
set preview_images_method kitty
# --------------------------
# Keybindings (LF-style)
# --------------------------

map . toggle_show_hidden
map p paste
map x cut
map y copy
map <enter> console open
map R reload_cwd
map mf console mkfile
map md console mkdir
map bg console setwallpaper
map C console clear
map dd console delete
map dt console trash
map cd console cd
map ct console cd ~/.local/share/Trash/files
map D console shell touch $(date "+%a|%b_%d_%Y").txt
map ? console help

# Archive bindings
map au console unarchive

# Manual/Help (optional)
